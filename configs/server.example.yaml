role: server

# 启动前需要在终端设置两个密码：
#   1) 服务端管理密码（Web 控制台登录）
#        mtun passwd -c configs/server.example.yaml
#   2) 客户端接入密码（客户端连接本服务端时填写）
#        mtun access -c configs/server.example.yaml
# 二者也会在首次通过 scripts/start-server.ps1 启动时引导设置。

# 控制面（TCP + TLS 1.3），中继 / STUN 仍为占位
control: ":10000"
wg: ":10001"
relay: ":10002"
stun: ":10003"

# 管理面强制只监听回环地址
dashboard: "127.0.0.1:10004"

# 在线更新仓库（owner/name）。留空则使用构建注入的 version.Repo；
# 环境变量 MTUN_UPDATE_REPO 优先级最高。
update_repo: "zhangsong-08/mtun"

overlay:
  cidr: "100.64.0.0/10"
  server_ip: "100.64.0.1"

publish:
  port_range: "10100-10999"
  # 服务端本地发布规则：公网 10100 -> 本机 8080
  rules:
    - name: demo-http
      proto: tcp
      listen: 10100
      target: "127.0.0.1:8080"
