role: client
# 节点名默认取主机名；显式填写会覆盖
node: nas

# 服务端控制面地址。留空表示首次启动后需要在客户端控制台
# （http://127.0.0.1:10005）手动添加地址与接入密码。
server: ""

# 客户端控制台，只监听回环地址
dashboard: "127.0.0.1:10005"

# 在线更新仓库（owner/name）。留空则使用构建注入的 version.Repo；
# 环境变量 MTUN_UPDATE_REPO 优先级最高。
update_repo: "zhangsong-08/mtun-remote-client"

# 客户端登录密码：首次打开控制台时由你自己设置，也可在终端设置：
#   mtun passwd -c configs/client.example.yaml
#
# 客户端接入密码（连接服务端用，由服务端管理员提供）不写在这个文件里：
#   1) 在控制台或 mtun connect -key 中填写后，保存到 <配置>.join（0600）
#   2) 环境变量 MTUN_JOIN_TOKEN 优先级更高

publish:
  # 也可以在客户端控制台添加转发规则，例如：
  #   name: nas-web  proto: tcp  listen: 10101  target: 127.0.0.1:5000
  rules: []

routes:
  - "192.168.1.0/24"
